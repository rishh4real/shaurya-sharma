<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f13"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="rose-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Glass Container -->
  <rect width="100" height="100" rx="28" fill="url(#bg-grad)"/>
  <rect width="98" height="98" x="1" y="1" rx="27" fill="none" stroke="url(#rose-gold)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Outer Ring Arc -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#rose-gold)" stroke-width="1.5" stroke-dasharray="150 60" stroke-linecap="round"/>

  <!-- Sleek Geometric Monogram S -->
  <path d="M62,33 C62,33 56,27 48,27 C38,27 34,33 34,40 C34,48 44,50 52,52 C62,55 66,60 66,68 C66,77 58,82 48,82 C38,82 32,75 32,75" 
        fill="none" stroke="url(#rose-gold)" stroke-width="6.5" stroke-linecap="round" filter="url(#glow)"/>
        
  <!-- Glowing AI Pulse Node -->
  <circle cx="62" cy="33" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
